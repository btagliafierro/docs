<text x="822.0" y="209.2" font-size="15" fill="#8a94a3" text-anchor="start" font-weight="normal">lattice nodes</text>
<text x="788.0" y="270.0" font-size="15" fill="#8a94a3" text-anchor="start" font-weight="normal">Water and gate on the same lattice: the gate</text>
<text x="788.0" y="289.5" font-size="15" fill="#8a94a3" text-anchor="start" font-weight="normal">surface, on the wet side only, lies halfway</text>
<text x="788.0" y="309.0" font-size="15" fill="#8a94a3" text-anchor="start" font-weight="normal">between them, and the floor surface halfway</text>
