<style>
  /* ==========================================
     USER CONTROLS (Tweak these two to adjust)
     ========================================== */
  :root {
    --sh-icon-scale: 3.8;          /* Scale icon up/down (1.0 = normal, 1.3 = +30%, 1.5 = +50%) */
    --bar-vertical-padding: 12px;  /* Adjust blue bar thickness (e.g. 8px, 12px, 16px) */
  }

  /* Force full width inside MkDocs layout */
  .workflow-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: 'Roboto', 'Arial', sans-serif;
    margin: 20px 0;
    width: 100% !important;
    box-sizing: border-box;
  }

  /* Top row containing Input, Logo, Output */
  .workflow-top-row {
    display: flex;
    flex-direction: row;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    gap: 8px;
    margin-bottom: 20px;
  }

  /* Section cards (Input / Output) */
  .workflow-card {
    flex: 1 1 0px;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px;
    border-radius: 20px;
    box-sizing: border-box;
    min-height: 210px;
  }

  .card-title {
    font-weight: 700;
    font-size: 15px;
    margin-bottom: 14px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  /* Input block styling */
  .input-card {
    background-color: #fce8e6;
    border: 2px solid #f2b8b5;
  }

  .input-icons-container {
    display: flex;
    flex-direction: row;
    gap: 20px;
    align-items: center;
    justify-content: center;
    height: 100%;
  }

  /* Icon wrapper styling */
  .file-asset-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 13px;
    color: #333333;
  }

  .file-asset-box img {
    width: 54px;
    height: 54px;
    object-fit: contain;
  }

  /* Output block styling */
  .output-card {
    background-color: #e6f4ea;
    border: 2px solid #a8dab5;
  }

  .output-video-container {
    width: 100%;
    max-width: 260px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #a0a0a0;
  }

  .output-video-container img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Center DualSPHysics logo block */
  .logo-center {
    flex: 1 1 0px;
    min-width: 80px; /* Prevent the SVG from collapsing in the mobile flex row. */
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 0 8px;
  }

  .logo-center img {
    max-width: 100%;
    max-height: 105px;
    height: auto;
    display: block;
  }

  /* Horizontal animated connector arrows between cards */
  .flow-arrow-connector {
    display: flex;
    align-items: center;
    justify-content: center;
    color: #4285f4;
    padding: 0 4px;
    flex-shrink: 0;
  }

  .flow-arrow-svg {
    width: 26px;
    height: 26px;
    animation: flowPulse 1.8s infinite ease-in-out;
  }

  /* Centered Arrow Banner */
  .arrow-banner-modern {
    width: 100%;
    background: linear-gradient(90deg, #e8f0fe 0%, #d2e3fc 100%);
    border: 1.5px solid #4285f4;
    border-radius: 36px;
    padding: var(--bar-vertical-padding) 28px;
    box-sizing: border-box;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    box-shadow: 0 3px 8px rgba(66, 133, 244, 0.18);
  }

  .arrow-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    text-align: center;
  }

  /* Base icon size with independent scale transform */
  .arrow-info img {
    width: 36px;
    height: 36px;
    object-fit: contain;
    transform: scale(var(--sh-icon-scale));
    transform-origin: center;
  }

  .arrow-text-group {
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .arrow-title {
    font-weight: 700;
    font-size: 15px;
    color: #174ea6;
  }

  .arrow-subtitle {
    font-size: 13px;
    color: #5f6368;
  }

  /* Pulsing right-arrow animation on bottom banner */
  .arrow-pointer-icon {
    position: absolute;
    right: 24px;
    display: flex;
    align-items: center;
    color: #174ea6;
    animation: flowPulse 1.8s infinite ease-in-out;
  }

  @keyframes flowPulse {
    0%, 100% {
      transform: translateX(0);
      opacity: 0.6;
    }
    50% {
      transform: translateX(5px);
      opacity: 1;
    }
  }
</style>

<div class="workflow-container">

  <!-- Top Section: INPUT | LOGO | OUTPUT -->
  <div class="workflow-top-row">
    
    <!-- INPUT Card -->
    <div class="workflow-card input-card">
      <div class="card-title" style="color: #c5221f;">INPUT</div>
      <div class="input-icons-container">
        <!-- XML Asset -->
        <div class="file-asset-box">
          <img src="../assets/images/user_guide/logo_xml.png" alt="XML file" />
          <span>XML</span>
        </div>
        <!-- STL Asset -->
        <div class="file-asset-box">
          <img src="../assets/images/user_guide/logo_stl.png" alt="STL file" />
          <span>STL</span>
        </div>
      </div>
    </div>

    <!-- Connector Arrow: INPUT -> LOGO -->
    <div class="flow-arrow-connector">
      <svg class="flow-arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="12" x2="18" y2="12"></line>
        <polyline points="12 6 18 12 12 18"></polyline>
      </svg>
    </div>

    <!-- DualSPHysics Logo Asset -->
    <div class="logo-center">
      <img src="../assets/images/dualsphysics-logo.svg" alt="DualSPHysics Logo" />
    </div>

    <!-- Connector Arrow: LOGO -> OUTPUT -->
    <div class="flow-arrow-connector">
      <svg class="flow-arrow-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="4" y1="12" x2="18" y2="12"></line>
        <polyline points="12 6 18 12 12 18"></polyline>
      </svg>
    </div>

    <!-- OUTPUT Card with GIF Asset -->
    <div class="workflow-card output-card">
      <div class="card-title" style="color: #137333;">OUTPUT</div>
      <div class="output-video-container">
        <img src="../assets/images/user_guide/side.gif" alt="Simulation Preview" />
      </div>
    </div>

  </div>

  <!-- Bottom Section: Centered Batch File Connector -->
  <div class="arrow-banner-modern">
    <div class="arrow-info">
      <!-- Batch File Icon Asset -->
      <img src="../assets/images/user_guide/logo_sh.png" alt="Batch script icon" />
      <div class="arrow-text-group">
        <span class="arrow-title">BATCH FILES (.bat / .sh)</span>
        <span class="arrow-subtitle">Executes full SPH simulation pipeline</span>
      </div>
    </div>
    
    <!-- Animated direction arrow indicator -->
    <div class="arrow-pointer-icon">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </div>
  </div>

</div>
