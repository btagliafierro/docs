<style>
  .pv-slideshow-container {
    position: relative;
    width: 100%;
    max-width: 800px;
    background-color: #191919;
    border: 1px solid #333;
    border-radius: 6px;
    overflow: hidden;
    margin: 20px 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
  }

  /* Slide Wrapper */
  .pv-slide {
    display: none;
    position: relative;
    cursor: pointer;
  }

  .pv-slide.active {
    display: block;
  }

  .pv-slide img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* Animated Simulated Cursor Overlay */
  .pv-cursor-hint {
    position: absolute;
    width: 24px;
    height: 24px;
    pointer-events: none;
    z-index: 10;
    animation: cursorPulse 1.8s infinite ease-in-out;
  }

  .pv-cursor-hint svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.8));
  }

  @keyframes cursorPulse {
    0%, 100% { transform: scale(1) translate(0, 0); }
    50% { transform: scale(1.2) translate(-2px, -2px); }
  }

  /* Bottom Controls & Step Indicator */
  .pv-controls {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #222;
    padding: 8px 16px;
    border-top: 1px solid #333;
    color: #ccc;
    font-size: 12px;
  }

  .pv-step-btn {
    background-color: #333;
    color: #fff;
    border: 1px solid #444;
    padding: 4px 12px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 11px;
  }

  .pv-step-btn:hover {
    background-color: #007acc;
    border-color: #007acc;
  }
</style>

<div class="pv-slideshow-container" id="pvSlideshow">

  <!-- STEP 1: Click Open File Icon -->
  <div class="pv-slide active" onclick="nextPvSlide()">
    <img src="../assets/images/paraview_step1.png" alt="ParaView Step 1: Click Open Folder" />
    <!-- Position Cursor over Open Folder Icon (top-left) -->
    <div class="pv-cursor-hint" style="top: 8%; left: 3%;">
      <svg viewBox="0 0 24 24" fill="#ffffff" stroke="#000000" stroke-width="1.5">
        <path d="M3 3l7 18 3-7 7-3L3 3z"/>
      </svg>
    </div>
  </div>

  <!-- STEP 2: Select Files in Dialog -->
  <div class="pv-slide" onclick="nextPvSlide()">
    <img src="../assets/images/paraview_step2.png" alt="ParaView Step 2: Select VTK Files" />
    <!-- Position Cursor over File Selection / OK button -->
    <div class="pv-cursor-hint" style="top: 88%; left: 93%;">
      <svg viewBox="0 0 24 24" fill="#ffffff" stroke="#000000" stroke-width="1.5">
        <path d="M3 3l7 18 3-7 7-3L3 3z"/>
      </svg>
    </div>
  </div>

  <!-- STEP 3: Click Apply Button -->
  <div class="pv-slide" onclick="nextPvSlide()">
    <img src="../assets/images/paraview_step3.png" alt="ParaView Step 3: Click Apply" />
    <!-- Position Cursor over Apply Button in Left Panel -->
    <div class="pv-cursor-hint" style="top: 60%; left: 4%;">
      <svg viewBox="0 0 24 24" fill="#ffffff" stroke="#000000" stroke-width="1.5">
        <path d="M3 3l7 18 3-7 7-3L3 3z"/>
      </svg>
    </div>
  </div>

  <!-- STEP 4: Click Play Button -->
  <div class="pv-slide" onclick="nextPvSlide()">
    <img src="../assets/images/paraview_step4.png" alt="ParaView Step 4: Click Play" />
    <!-- Position Cursor over Play Button in Toolbar -->
    <div class="pv-cursor-hint" style="top: 8%; left: 41%;">
      <svg viewBox="0 0 24 24" fill="#ffffff" stroke="#000000" stroke-width="1.5">
        <path d="M3 3l7 18 3-7 7-3L3 3z"/>
      </svg>
    </div>
  </div>

  <!-- Control Footer -->
  <div class="pv-controls">
    <button class="pv-step-btn" onclick="prevPvSlide()">◄ Previous</button>
    <span id="pvStepText">Step 1 of 4: Click Open File icon</span>
    <button class="pv-step-btn" onclick="nextPvSlide()">Next ►</button>
  </div>

</div>

<script>
  let currentPvSlide = 0;
  const pvStepDescriptions = [
    "Step 1 of 4: Click Open File icon",
    "Step 2 of 4: Select .vtk files and click OK",
    "Step 3 of 4: Click Apply in Properties panel",
    "Step 4 of 4: Click Play button to run animation"
  ];

  function showPvSlide(index) {
    const slides = document.querySelectorAll('#pvSlideshow .pv-slide');
    if (index >= slides.length) currentPvSlide = 0;
    else if (index < 0) currentPvSlide = slides.length - 1;
    else currentPvSlide = index;

    slides.forEach((slide, i) => {
      slide.classList.toggle('active', i === currentPvSlide);
    });

    document.getElementById('pvStepText').innerText = pvStepDescriptions[currentPvSlide];
  }

  function nextPvSlide() {
    showPvSlide(currentPvSlide + 1);
  }

  function prevPvSlide() {
    showPvSlide(currentPvSlide - 1);
  }
</script>
